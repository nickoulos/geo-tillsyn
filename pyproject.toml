[project]
name = "geo-tillsyn"
version = "0.1.0"
description = "Handläggar-copilot för geodata-baserad tillsyn: REALITY vs RULE -> DIFF -> spårbar dossier. Govtech4all Pilot 3 prototype."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Foursight Lab" }]
dependencies = [
    "mcp>=1.0",
    "mcp-ogc",
    "numpy>=2.0",
    "pillow>=10.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.4",
]

[project.scripts]
geo-tillsyn = "geo_tillsyn.cli:main"
geo-tillsyn-mcp = "geo_tillsyn.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_tillsyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
